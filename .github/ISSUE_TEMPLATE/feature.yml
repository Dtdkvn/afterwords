name: Feature request
description: Propose an improvement that fits Afterwords' trust boundary
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem before the implementation. Afterwords treats the browser/server trust boundary, safe recovery, and observable delivery as product requirements.

        **Do not include real vault content, contact details, credentials, tokens, release URLs, or trustee shares.** Report security-sensitive ideas or vulnerabilities through the private security link in the issue chooser.

  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Owner setup and check-in
        - Vault encryption and files
        - Trustees and Recovery Kits
        - Recipient recovery
        - SMTP and delivery reliability
        - Deployment and operations
        - Accessibility and content design
        - Developer experience and releases
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who encounters the problem, under what conditions, and what do they do today?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible result without prescribing an implementation if possible.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional. Include interaction details, failure behavior, or migration needs that matter.

  - type: textarea
    id: trust
    attributes:
      label: Trust-boundary and recovery impact
      description: Could this expose plaintext, passphrases, keys, shares, capability URLs, contact metadata, or new third-party dependencies? How should failure remain visible and recoverable?
      placeholder: No new secret crosses the server boundary. A failed delivery would remain in the durable outbox and...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include operational workarounds or a smaller version of the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I reviewed the documented v0.1 scope and security model.
          required: true
        - label: I used only fictional examples and included no secrets, tokens, shares, private URLs, personal information, or vault content.
          required: true
