name: afterwords-dev

services:
  api:
    image: golang:1.26.5-alpine@sha256:0178a641fbb4858c5f1b48e34bdaabe0350a330a1b1149aabd498d0699ff5fb2
    working_dir: /workspace
    command: sh -c "go mod download && go run ./cmd/afterwords"
    environment:
      PORT: "8080"
      BASE_URL: http://localhost:5173
      DB_PATH: /workspace-data/afterwords.db
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: Afterwords <afterwords@localhost>
      SMTP_TLS_POLICY: none
      TIME_SCALE: "${TIME_SCALE:-1}"
      SECURE_COOKIES: "false"
      LOG_LEVEL: debug
    volumes:
      - .:/workspace
      - afterwords-go-mod:/go/pkg/mod
      - afterwords-go-cache:/root/.cache/go-build
      - afterwords-dev-data:/workspace-data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mailpit:
        condition: service_started

  web:
    image: node:24-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    working_dir: /workspace/web
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://api:8080
    volumes:
      - ./web:/workspace/web
      - afterwords-web-modules:/workspace/web/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:v1.30.7@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  afterwords-dev-data:
  afterwords-go-cache:
  afterwords-go-mod:
  afterwords-web-modules:
