version: 2

project_name: afterwords

before:
  hooks:
    - npm ci --prefix web
    - npm run build --prefix web
    - git diff --exit-code -- internal/server/webdist

builds:
  - id: afterwords
    main: ./cmd/afterwords
    binary: afterwords
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - ids:
      - afterwords
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - CONTRIBUTING.md
      - .env.example
      - scripts/record-demo.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
